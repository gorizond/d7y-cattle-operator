name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The test and release jobs build from the Dockerfile; there is no
      # separate setup-go step. Keep its builder image in lockstep with go.mod
      # so a dependency bump cannot ship an image that cannot run go mod
      # download (the 0.1.56 failure: go.mod 1.27.0, builder 1.26).
      - name: Check Go toolchain matches go.mod
        run: |
          go_version="$(sed -n 's/^go \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' go.mod | head -1)"
          image_version="$(sed -n 's/^FROM golang:\([0-9][0-9]*\.[0-9][0-9]*\)-alpine.*/\1/p' Dockerfile | head -1)"
          if [ -z "$go_version" ] || [ -z "$image_version" ]; then
            echo "could not read the Go version from go.mod or the Dockerfile" >&2
            exit 1
          fi
          if [ "$go_version" != "$image_version" ]; then
            echo "Dockerfile golang:$image_version does not match go.mod go $go_version" >&2
            exit 1
          fi

      - name: Build test image
        run: docker build --target test -t d7y-cattle-operator:test .

      - name: Run unit tests
        run: docker run --rm d7y-cattle-operator:test go test ./...

      - name: Build operator image
        run: docker build -t d7y-cattle-operator:ci .

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint charts
        run: helm lint charts/*

      - name: Render charts
        run: |
          helm template d7y-cattle-operator charts/d7y-cattle-operator > /dev/null
          helm template dragonfly-extras charts/dragonfly-extras --set ingress.enabled=true --set vpa.enabled=true --api-versions autoscaling.k8s.io/v1 > /dev/null
          helm template p2p-static charts/p2p-static > /dev/null
          helm template containerd-mirror charts/containerd-mirror > /dev/null

      - name: Render extras ingress modes
        run: bash scripts/test-extras-ingress.sh

      - name: Render fork chart TLS probes
        run: bash scripts/test-fork-chart-tls.sh
