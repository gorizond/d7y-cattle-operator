name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t d7y-cattle-operator:test .

      - name: Run unit tests
        run: docker run --rm d7y-cattle-operator:test go test ./...

      - name: Build host resolver
        run: docker run --rm d7y-cattle-operator:test sh -c 'CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/nydus-resolver ./cmd/nydus-resolver'

      - name: Build operator image
        run: docker build -t d7y-cattle-operator:ci .

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint charts
        run: helm lint charts/*

      - name: Render charts
        run: |
          helm template d7y-cattle-operator charts/d7y-cattle-operator --set webhook.enabled=true > /dev/null
          helm template dragonfly-extras charts/dragonfly-extras --set ingress.enabled=true --set vpa.enabled=true --api-versions autoscaling.k8s.io/v1 > /dev/null
          helm template p2p-static charts/p2p-static > /dev/null
          helm template registry-proxy charts/registry-proxy > /dev/null

      - name: Render extras ingress modes
        run: bash scripts/test-extras-ingress.sh

      - name: Render registry proxy checks
        run: bash scripts/test-registry-proxy.sh

      - name: Render fork chart TLS probes
        run: bash scripts/test-fork-chart-tls.sh
