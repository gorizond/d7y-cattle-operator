name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    # Image builds only for release tags. Manual dispatch is for chart
    # publishing when a release already exists.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64  # ARM64 deferred until GA.
          tags: ghcr.io/gorizond/d7y-cattle-operator:${{ github.ref_name }}

  resolver:
    # Static host binary attached to the same v* GitHub Release as the image.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static resolver
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o dist/nydus-resolver-linux-amd64 ./cmd/nydus-resolver
          help_output="$(./dist/nydus-resolver-linux-amd64 --help 2>&1)"
          case "$help_output" in
            *Usage*) ;;
            *) echo "resolver --help did not print usage" >&2; exit 1 ;;
          esac
          if ./dist/nydus-resolver-linux-amd64 --config /nonexistent >/tmp/nydus-resolver-no-config.log 2>&1; then
            echo "resolver accepted a missing --config" >&2
            exit 1
          fi
          test -s /tmp/nydus-resolver-no-config.log
          (cd dist && sha256sum nydus-resolver-linux-amd64 > nydus-resolver-linux-amd64.sha256)

      - name: Upload resolver release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Static host assets for $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/nydus-resolver-linux-amd64 \
            dist/nydus-resolver-linux-amd64.sha256

  chart:
    # The first tag has no previous tag to diff against, so chart-releaser-action
    # v1.7.0 reported "Nothing to do. No chart changes detected" and published
    # nothing. Publish explicitly instead: package every chart, create/update
    # chart releases, and push index.yaml to gh-pages. This job is also runnable
    # by workflow_dispatch without rebuilding the existing image.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      # cr upload/index use origin/gh-pages; a shallow tag checkout does not
      # contain that ref. Fetch it explicitly and keep a local branch for cr.
      - name: Fetch gh-pages
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git branch -f gh-pages refs/remotes/origin/gh-pages

      # Publish every chart checked into charts/. The external enapter/keydb
      # chart is pinned by the operator but is not vendored here.
      - name: Lint charts
        run: helm lint charts/*

      - name: Install chart-releaser
        run: |
          curl -fsSL -o cr.tar.gz https://github.com/helm/chart-releaser/releases/download/v1.7.0/chart-releaser_1.7.0_linux_amd64.tar.gz
          tar -xzf cr.tar.gz cr
          sudo install -m 0755 cr /usr/local/bin/cr

      - name: Package charts
        run: cr package charts/*

      - name: Upload chart releases
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cr upload -o gorizond -r d7y-cattle-operator \
            -p .cr-release-packages --token "$CR_TOKEN" --skip-existing

      # cr index commits index.yaml to gh-pages. The runner has no git identity,
      # so without this the push fails with "Author identity unknown" /
      # "fatal: empty ident name ... not allowed".
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update chart index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cr-index
          cr index -o gorizond -r d7y-cattle-operator \
            -p .cr-release-packages -i .cr-index/index.yaml \
            --push --pages-branch gh-pages --token "$CR_TOKEN"
