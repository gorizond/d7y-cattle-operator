apiVersion: fleet.cattle.io/v1alpha1
kind: HelmOp
metadata:
  name: poligon-cert-manager
  namespace: fleet-default
spec:
  defaultNamespace: cert-manager
  helm:
    repo: https://charts.jetstack.io
    chart: cert-manager
    version: v1.21.3
    values:
      crds:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      webhook:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      cainjector:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  targets:
    - clusterName: poligon
