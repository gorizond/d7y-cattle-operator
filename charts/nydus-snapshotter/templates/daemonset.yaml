apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nydus-snapshotter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nydus-snapshotter.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "nydus-snapshotter.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/nydus: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/containerd: {{ include (print $.Template.BasePath "/containerd-configmap.yaml") . | sha256sum }}
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      hostPID: {{ .Values.hostPid }}
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: {{ .Values.priorityClassName }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: containerd-config
          image: {{ .Values.initImage }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              # The drop-in only works when config-v3.toml.tmpl imports the
              # drop-in directory. Warn instead of blocking the node.
              if [ ! -f /host-containerd/config-v3.toml.tmpl ] && [ ! -f /host-containerd/config-v3.toml ]; then
                echo "warning: no RKE2 containerd config template under {{ .Values.containerd.configDir }}" >&2
              fi
{{- if .Values.containerd.manage }}
              src="/dropin/{{ .Values.containerd.dropInFile }}"
              dst="/host-dropin/{{ .Values.containerd.dropInFile }}"
              mkdir -p /host-dropin
              if [ -f "$dst" ] && cmp -s "$src" "$dst"; then
                echo "containerd drop-in unchanged"
              else
                # Atomic replace: containerd must never import a partial file.
                cp "$src" "$dst.tmp"
                mv "$dst.tmp" "$dst"
                echo "containerd drop-in updated; manually restart rke2-agent/rke2-server to apply it"
              fi
              # Replace the static bootstrap units that own the same socket.
              /bin/busybox nsenter -t 1 -m -- \
                systemctl disable --now dfdaemon-bootstrap.service nydus-snapshotter-bootstrap.service \
                >/dev/null 2>&1 || true
{{- end }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-containerd-config
              mountPath: /host-containerd
              readOnly: true
            - name: dropin
              mountPath: /dropin
              readOnly: true
            - name: host-dropin
              mountPath: /host-dropin
      containers:
        - name: nydus-snapshotter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - {{ printf "%s/containerd-nydus-grpc" .Values.nydusArtifactsDir | quote }}
          args:
            - --config=/etc/nydus/config.toml
            - --nydusd-config=/etc/nydus/nydusd-config.json
            - --log-to-stdout
          securityContext:
            privileged: true
          volumeMounts:
            - name: nydus-config
              mountPath: /etc/nydus
              readOnly: true
            - name: fuse
              mountPath: /dev/fuse
            - name: containerd-socket
              mountPath: {{ dir .Values.hostSocket }}
            - name: containerd-state
              mountPath: {{ .Values.containerd.stateDir }}
            - name: nydus-run
              mountPath: {{ .Values.snapshotter.socketDir }}
              mountPropagation: Bidirectional
            - name: nydus-root
              mountPath: {{ .Values.snapshotter.root }}
              mountPropagation: Bidirectional
            - name: nydus-cache
              mountPath: {{ .Values.nydusd.cacheDir }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nydus-config
          configMap:
            name: {{ .Release.Name }}-nydus
        - name: host-containerd-config
          hostPath:
            path: {{ .Values.containerd.configDir }}
            type: Directory
        - name: dropin
          configMap:
            name: {{ .Release.Name }}-containerd
        - name: host-dropin
          hostPath:
            path: {{ .Values.containerd.dropInDir }}
            type: DirectoryOrCreate
        - name: fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: containerd-socket
          hostPath:
            path: {{ dir .Values.hostSocket }}
            type: Directory
        - name: containerd-state
          hostPath:
            path: {{ .Values.containerd.stateDir }}
            type: DirectoryOrCreate
        - name: nydus-run
          hostPath:
            path: {{ .Values.snapshotter.socketDir }}
            type: DirectoryOrCreate
        - name: nydus-root
          hostPath:
            path: {{ .Values.snapshotter.root }}
            type: DirectoryOrCreate
        - name: nydus-cache
          hostPath:
            path: {{ .Values.nydusd.cacheDir }}
            type: DirectoryOrCreate
