{{- $mode := .Values.snapshotterMode -}}
{{- if not (has $mode (list "perRuntime" "global")) -}}
{{- fail (printf "snapshotterMode must be perRuntime or global, got %q" $mode) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-containerd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nydus-snapshotter.labels" . | nindent 4 }}
data:
  {{ .Values.containerd.dropInFile }}: |
{{- if eq $mode "perRuntime" }}
    # Nydus is opt-in through runtimeClass: nydus. The node default snapshotter
    # stays overlayfs. containerd 2.2 needs both the runtime entry and the
    # runtime_platforms mapping; the latter tells CRI which snapshotter to use
    # for the unpack.
    [plugins.'io.containerd.cri.v1.images']
      use_local_image_pull = true
      disable_snapshot_annotations = false
      discard_unpacked_layers = false
      [plugins.'io.containerd.cri.v1.images'.runtime_platforms.nydus]
        snapshotter = 'nydus'

    [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.nydus]
      runtime_type = 'io.containerd.runc.v2'
      snapshotter = 'nydus'
      [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.nydus.options]
        SystemdCgroup = true

    [proxy_plugins.nydus]
      type = 'snapshot'
      address = {{ include "nydus-snapshotter.socketPath" . | quote }}
{{- else }}
    # Global mode: every CRI workload on the node uses nydus. No runtimes.nydus
    # entry is needed; the node default runtime applies.
    [plugins.'io.containerd.cri.v1.images']
      snapshotter = 'nydus'
      use_local_image_pull = true
      disable_snapshot_annotations = false
      discard_unpacked_layers = false

    [proxy_plugins.nydus]
      type = 'snapshot'
      address = {{ include "nydus-snapshotter.socketPath" . | quote }}
{{- end }}
