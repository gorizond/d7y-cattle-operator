namespace: kube-system

image:
  repository: busybox
  tag: "1.36"
  pullPolicy: IfNotPresent

# Local dfdaemon proxy port. certs.d/_default covers any registry via
# dfdaemon; docker.io and index.docker.io keep explicit aliases pointing at
# registry-1.docker.io. No proxy.registries or other per-registry files.
port: 4001

# Reconcile interval for copying the ConfigMap into the containerd certs.d
# directory (ConfigMap volume updates propagate; this loop picks them up).
reconcileSeconds: 60

# RKE2 containerd hosts.toml directory.
hostPath: /var/lib/rancher/rke2/agent/etc/containerd/certs.d

tolerations:
  - operator: Exists
