namespace: kube-system

image:
  repository: busybox
  tag: "1.36"
  pullPolicy: IfNotPresent

# Local dfdaemon proxy port. The only hosts file is certs.d/_default/hosts.toml:
# dfdaemon 1.5.14 infers the upstream registry from containerd's ?ns=. No
# per-registry files or X-Dragonfly-Registry headers are written.
port: 4001

# Reconcile interval for copying the ConfigMap into the containerd certs.d
# directory (ConfigMap volume updates propagate; this loop picks them up).
reconcileSeconds: 60

# RKE2 containerd hosts.toml directory.
hostPath: /var/lib/rancher/rke2/agent/etc/containerd/certs.d

tolerations:
  - operator: Exists
