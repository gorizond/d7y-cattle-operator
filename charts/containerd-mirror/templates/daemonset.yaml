apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: containerd-mirror
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: containerd-mirror
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: containerd-mirror
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mirror
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              # Only certs.d/_default is managed. dfdaemon 1.5.14 infers the
              # upstream registry from containerd's ?ns=; per-registry files
              # with X-Dragonfly-Registry are obsolete. Remove the two legacy
              # files written by older chart versions and reconcile the
              # ConfigMap copy periodically.
              while true; do
                mkdir -p /host-certs/_default
                cp /config/_default /host-certs/_default/hosts.toml
                rm -rf /host-certs/docker.io /host-certs/index.docker.io
                sleep {{ .Values.reconcileSeconds | default 60 }}
              done
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: certs
              mountPath: /host-certs
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-hosts
        - name: certs
          hostPath:
            path: {{ .Values.hostPath | quote }}
            type: DirectoryOrCreate
