{{- if .Values.ciliumNetworkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-proxy.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "registry-proxy.selectorLabels" . | nindent 6 }}
  egress:
    # Cilium matches egress after DNAT and the kube-apiserver runs behind the
    # remote-node identity (reserved:remote-node), which a plain NetworkPolicy
    # ipBlock cannot express. The entity selector covers the RKE2 API port.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
{{- end }}
