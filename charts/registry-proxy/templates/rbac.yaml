{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-robot-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-proxy.labels" . | nindent 4 }}
rules:
  # The robot Secret is provisioned by the operator and mounted read-only by
  # the kubelet. This rule is the only API permission retained: read the one
  # Secret, never create, update, or delete.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.harbor.robotSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-robot-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-robot-secret
subjects:
  - kind: ServiceAccount
    name: {{ default .Release.Name .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
