{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-robot-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-proxy.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.harbor.robotSecret | quote }}]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-robot-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-robot-secret
subjects:
  - kind: ServiceAccount
    name: {{ default .Release.Name .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
