apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "registry-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "registry-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "registry-proxy.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ default (include "registry-proxy.fullname" .) .Values.serviceAccount.name }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.proxy.hostAliases }}
      hostAliases:
        {{- range . }}
        - ip: {{ .ip | quote }}
          hostnames:
            {{- range .hostnames }}
            - {{ . | quote }}
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: registry-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/registry-proxy
              readOnly: true
            - name: harbor-admin
              mountPath: /etc/registry-proxy/secrets/admin
              readOnly: true
            - name: harbor-robot
              mountPath: /etc/registry-proxy/secrets/robot
              readOnly: true
            - name: webhook
              mountPath: /etc/registry-proxy/secrets/webhook
              readOnly: true
            - name: work
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "registry-proxy.fullname" . }}-config
        - name: harbor-admin
          secret:
            secretName: {{ .Values.harbor.adminSecret }}
        - name: harbor-robot
          secret:
            secretName: {{ .Values.harbor.robotSecret }}
            optional: true
        - name: webhook
          secret:
            secretName: {{ .Values.webhook.secretName }}
            optional: true
        - name: work
          emptyDir: {}
