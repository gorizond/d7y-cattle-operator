{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "registry-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dragonfly-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
        # dfdaemon runs with hostNetwork on the node.
        - ipBlock:
            cidr: {{ .Values.networkPolicy.nodeCIDR | quote }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 8080
          protocol: TCP
{{- end }}
