apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-proxy.labels" . | nindent 4 }}
data:
  config.yaml: |
    harbor:
      url: {{ .Values.harbor.url | quote }}
      admin_secret: {{ .Values.harbor.adminSecret | quote }}
      robot_secret: {{ .Values.harbor.robotSecret | quote }}
    mirror:
      project: {{ .Values.mirror.project | quote }}
    registry:
      allowlist:
{{- range .Values.registry.allowlist }}
        - {{ . | quote }}
{{- end }}
    proxy:
      public_url: {{ .Values.proxy.publicURL | quote }}
    webhook:
      secret_name: {{ .Values.webhook.secretName | quote }}
    conversion:
      platform: {{ .Values.conversion.platform | quote }}
      nydusify: {{ .Values.conversion.nydusify | quote }}
      nydus_image: {{ .Values.conversion.nydusImage | quote }}
      work_dir: {{ .Values.conversion.workDir | quote }}
      timeout: {{ .Values.conversion.timeout | quote }}
    service:
      port: {{ .Values.service.port }}
