# Privileged host sync for the pre-RKE2 dfdaemon bootstrap.
image:
  repository: busybox
  tag: "1.36"
  pullPolicy: IfNotPresent

# Comma-separated scheduler node IPs rendered by the operator from
# p2p.dragonfly.io/scheduler-ips. Each entry gets :8002 appended by the
# operator before it is placed here.
schedulerIPs: []

# Client identity Secret mounted into the pod. The shared control HelmOp is the
# only downstreamResources owner; host-sync depends on control and only mounts
# the copy it delivers.
mtlsSecret: dragonfly-p2p-mtls

# Live version/checksum inputs written to /etc/nydus and consumed by the
# nydus-updater and a later p2p-install block re-run.
staticURL: ""
versions:
  client: v1.5.14
  nydus: v2.4.5
  snapshotter: v0.16.0
repos:
  client: dragonflyoss/client
  nydus: dragonflyoss/nydus
  snapshotter: containerd/nydus-snapshotter
checksums:
  client:
    amd64: ba080e62f1626ab2fc2a5a0629a5cd912cc15099508820403108abbe2f75b1f7
    arm64: 370ff792a1c6957a7244b770d6cd12792668e326b2282b3017fea2cbfa3510af
  nydus:
    amd64: 1ad7b793a1996577e462b0bf5c1a22e4450b9c04f7e9e99d4b274ccc92f19072
    arm64: 85925af702d79fc3a8b9d501a5267ddc9f81449ff9fe94841845eb98eda84593
  snapshotter:
    amd64: 24e4ceaae9c87e396e71e89bd3eb074f2cc6a5a14b1a2081c8d890481857a0e4
    arm64: 136e9c649a63c16b3d3322a15fcdf918e7dda9a4cbb043e2923451e87a8ba08f
  snapshotterBinary:
    amd64: 9bd24308ef51139310bf58927a97eec49567d0154606bc5774ad69d2ee492ff0
    arm64: 399f7a5b800bb6d05c63bbb340e7fa1820b84609b882589a6a95dd8796d03859

# ConfigMap/Secret source directory and host config directory.
hostConfigDir: /etc/dragonfly
syncIntervalSeconds: 30

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

tolerations:
  - operator: Exists

nodeSelector: {}
podAnnotations: {}
