apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: p2p-host-sync
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  versions.env: |-
{{ include "p2p-host-sync.versionsEnv" . | indent 4 }}
  updater.env: |-
{{ include "p2p-host-sync.versionsEnv" . | indent 4 }}
  nydus-updater: |-
{{ .Files.Get "files/nydus-updater" | indent 4 }}
  nydus-fs-select.sh: |-
{{ .Files.Get "files/nydus-fs-select.sh" | indent 4 }}
  scheduler-ips: {{ join "," .Values.schedulerIPs | quote }}
  dynconfig.yaml: |
    scheduler:
{{- if .Values.schedulerIPs }}
      addrs:
{{- range .Values.schedulerIPs }}
      - {{ . | quote }}
{{- end }}
{{- else }}
      addrs: []
{{- end }}
  sync.sh: |
    #!/bin/sh
    set -u
    HOST_DIR=/host{{ .Values.hostConfigDir }}
    HOST_NYDUS=/host/etc/nydus
    HOST_BIN=/host/usr/local/bin
    SRC_CONFIG=/source/config
    SRC_CERTS=/source/certs
    log() { echo "p2p-host-sync: $*" >&2; }
    mkdir -p "$HOST_DIR/certs" "$HOST_NYDUS" "$HOST_BIN" || exit 1

    sync_file() {
      src="$1"
      dst="$2"
      mode="$3"
      if [ ! -r "$src" ]; then
        log "source $src is not readable; keeping $dst"
        return 0
      fi
      tmp="${dst}.tmp.$$"
      if ! cp "$src" "$tmp" 2>/dev/null; then
        rm -f "$tmp"
        log "copy $src failed; keeping $dst"
        return 0
      fi
      chmod "$mode" "$tmp" || { rm -f "$tmp"; log "chmod $tmp failed"; return 0; }
      if [ -f "$dst" ] && cmp -s "$tmp" "$dst"; then
        rm -f "$tmp"
        return 0
      fi
      if mv -f "$tmp" "$dst"; then
        return 1
      fi
      log "replace $dst failed"
      return 0
    }

    while true; do
      if [ -r "$SRC_CONFIG/dynconfig.yaml" ]; then
        sync_file "$SRC_CONFIG/dynconfig.yaml" "$HOST_DIR/dynconfig.yaml" 0644
        if [ -r "$SRC_CONFIG/scheduler-ips" ]; then
          ips="$(tr -d '\r\n' < "$SRC_CONFIG/scheduler-ips" 2>/dev/null || true)"
          tmp="$HOST_DIR/scheduler-ips.tmp.$$"
          if [ -n "$ips" ]; then
            if printf '%s\n' "$ips" > "$tmp" 2>/dev/null; then
              chmod 0644 "$tmp" && mv -f "$tmp" "$HOST_DIR/scheduler-ips" || log "replace scheduler-ips failed"
            else
              rm -f "$tmp"
              log "write scheduler-ips failed"
            fi
          else
            rm -f "$HOST_DIR/scheduler-ips"
          fi
        else
          log "$SRC_CONFIG/scheduler-ips is not readable; keeping marker"
        fi
      else
        log "$SRC_CONFIG/dynconfig.yaml is not readable; keeping config"
      fi

      certs_ok=1
      for file in ca.crt tls.crt tls.key; do
        [ -r "$SRC_CERTS/$file" ] || certs_ok=0
      done
      if [ "$certs_ok" = 1 ]; then
        sync_file "$SRC_CERTS/ca.crt" "$HOST_DIR/certs/ca.crt" 0644
        sync_file "$SRC_CERTS/tls.crt" "$HOST_DIR/certs/tls.crt" 0644
        sync_file "$SRC_CERTS/tls.key" "$HOST_DIR/certs/tls.key" 0600
      else
        log "client certificate source is incomplete; keeping existing certs"
      fi

      version_changed=0
      sync_file "$SRC_CONFIG/versions.env" "$HOST_NYDUS/versions.env" 0644 || version_changed=1
      sync_file "$SRC_CONFIG/updater.env" "$HOST_NYDUS/updater.env" 0644 || version_changed=1
      sync_file "$SRC_CONFIG/nydus-updater" "$HOST_BIN/nydus-updater" 0755 || version_changed=1
      sync_file "$SRC_CONFIG/nydus-fs-select.sh" "$HOST_BIN/nydus-fs-select" 0755 || version_changed=1

      # Trigger the host updater once per revision. It decides whether the
      # snapshotter/client actually changed and is the only component that
      # restarts those services.
      if [ -x "$HOST_BIN/nydus-updater" ] && [ -r "$SRC_CONFIG/versions.env" ] && [ -r "$SRC_CONFIG/updater.env" ]; then
        revision="$(cat "$SRC_CONFIG/versions.env" "$SRC_CONFIG/updater.env" "$SRC_CONFIG/nydus-updater" "$SRC_CONFIG/nydus-fs-select.sh" | sha256sum | cut -d' ' -f1)"
        marker="$HOST_NYDUS/.host-sync-revision"
        if [ "$version_changed" = 1 ] || [ "$(cat "$marker" 2>/dev/null || true)" != "$revision" ]; then
          if nsenter -t 1 -m -u -i -n -p -- systemctl start nydus-updater.service; then
            printf '%s\n' "$revision" > "$marker.tmp.$$" && mv -f "$marker.tmp.$$" "$marker"
            log "triggered nydus-updater for revision $revision"
          else
            log "failed to trigger nydus-updater; will retry"
          fi
        fi
      fi

      sleep "${SYNC_INTERVAL_SECONDS:-30}"
    done
