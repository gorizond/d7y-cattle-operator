apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: p2p-host-sync
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: p2p-host-sync
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p2p-host-sync
        app.kubernetes.io/instance: {{ .Release.Name }}
{{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
{{- end }}
    spec:
      automountServiceAccountToken: false
      hostPID: true
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: host-sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/sync.sh"]
          env:
            - name: SYNC_INTERVAL_SECONDS
              value: {{ .Values.syncIntervalSeconds | quote }}
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: host-config
              mountPath: /host{{ .Values.hostConfigDir }}
            - name: host-nydus
              mountPath: /host/etc/nydus
            - name: host-bin
              mountPath: /host/usr/local/bin
            - name: source-config
              mountPath: /source/config
              readOnly: true
            - name: source-certs
              mountPath: /source/certs
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: host-config
          hostPath:
            path: {{ .Values.hostConfigDir }}
            type: DirectoryOrCreate
        - name: host-nydus
          hostPath:
            path: /etc/nydus
            type: DirectoryOrCreate
        - name: host-bin
          hostPath:
            path: /usr/local/bin
            type: DirectoryOrCreate
        - name: source-config
          configMap:
            name: {{ .Release.Name }}-config
            items:
              - key: dynconfig.yaml
                path: dynconfig.yaml
              - key: scheduler-ips
                path: scheduler-ips
              - key: versions.env
                path: versions.env
              - key: updater.env
                path: updater.env
              - key: nydus-updater
                path: nydus-updater
              - key: nydus-fs-select.sh
                path: nydus-fs-select.sh
        - name: source-certs
          secret:
            secretName: {{ .Values.mtlsSecret }}
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: script
          configMap:
            name: {{ .Release.Name }}-config
            defaultMode: 0755
            items:
              - key: sync.sh
                path: sync.sh
