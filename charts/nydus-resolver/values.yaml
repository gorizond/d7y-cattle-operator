# The resolver runs as a node-local DaemonSet. It is not wired into the
# operator HelmOps; install this chart explicitly on nodes that use
# nydus-snapshotter through the registry proxy.
image:
  repository: ghcr.io/gorizond/d7y-cattle-operator
  # Must be an image tag that contains /nydus-resolver. Override for local or
  # pilot builds until the first release image includes the binary.
  tag: v0.1.33
  pullPolicy: IfNotPresent

# The proxy binds to loopback only. Every node runs its own instance because
# the nydus-snapshotter process connects to 127.0.0.1.
listen:
  address: 127.0.0.1
  port: 3999

# Upstream registry proxy. Requests are rewritten to
# https://<upstream>/<mapped-registry>/v2/...
upstream: https://proxy.koldun.negash.ru

# Additional or overriding registry mappings as "host=path,..." entries.
# Unknown hosts are rejected. The built-in map covers docker.io (registry-1
# and index), ghcr.io, quay.io, registry.k8s.io, gcr.io, and mcr.microsoft.com.
registryMap: ""

ca:
  # hostPath shared with the host nydus-snapshotter process. The CA
  # certificate is generated on first start; the private key stays 0600 and
  # must never be copied to clients.
  hostPath: /var/lib/nydus-resolver
  mountPath: /var/lib/nydus-resolver
  certFile: ca.crt

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

nodeSelector: {}
# Run on every node, including control-plane nodes, unless overridden: the
# resolver is a node-local dependency of the host snapshotter.
tolerations:
  - operator: Exists

podAnnotations: {}
