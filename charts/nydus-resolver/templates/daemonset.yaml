apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nydus-resolver.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nydus-resolver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nydus-resolver.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # The nydus-snapshotter process runs on the host and dials
      # 127.0.0.1:3999, so the resolver must share the host network namespace.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # hostPath DirectoryOrCreate is root-owned. Give the non-root resolver
        # write access to the CA directory before it starts.
        - name: ca-dir
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - mkdir -p "{{ .Values.ca.mountPath }}" && chown 65532:65532 "{{ .Values.ca.mountPath }}" && chmod 0755 "{{ .Values.ca.mountPath }}"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ca
              mountPath: {{ .Values.ca.mountPath }}
      containers:
        - name: nydus-resolver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /nydus-resolver
          args:
            - "--listen={{ .Values.listen.address }}:{{ .Values.listen.port }}"
            - "--upstream={{ .Values.upstream }}"
            - "--ca-cert-out={{ .Values.ca.mountPath }}/{{ .Values.ca.certFile }}"
            {{- if .Values.registryMap }}
            - "--registry-map={{ .Values.registryMap }}"
            {{- end }}
          ports:
            - name: proxy
              containerPort: {{ .Values.listen.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              host: 127.0.0.1
              port: {{ .Values.listen.port }}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              host: 127.0.0.1
              port: {{ .Values.listen.port }}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: ca
              mountPath: {{ .Values.ca.mountPath }}
      volumes:
        - name: ca
          hostPath:
            path: {{ .Values.ca.hostPath | quote }}
            type: DirectoryOrCreate
