{{- $crt := required "tls.crt is required" .Values.tls.crt -}}
{{- $key := required "tls.key is required" .Values.tls.key -}}
{{- $ca := required "tls.ca is required" .Values.tls.ca -}}
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-p2p-scheduler
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | b64enc | quote }}
  tls.key: {{ $key | b64enc | quote }}
  ca.crt: {{ $ca | b64enc | quote }}
