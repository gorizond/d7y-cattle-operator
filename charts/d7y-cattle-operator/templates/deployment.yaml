apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "d7y-cattle-operator.fullname" . }}
  labels:
    {{- include "d7y-cattle-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "d7y-cattle-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "d7y-cattle-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "d7y-cattle-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ include "d7y-cattle-operator.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElect }}
          env:
            - name: MANAGER_GRPC_DOMAIN
              value: {{ .Values.manager.grpcDomain | quote }}
            - name: MANAGER_GRPC_PORT
              value: {{ .Values.manager.grpcPort | quote }}
            - name: MANAGER_API_URL
              value: {{ .Values.manager.apiURL | quote }}
            - name: NGINX_STATIC_URL
              value: {{ .Values.nginx.staticURL | quote }}
            - name: NYDUS_MIRROR_URL
              value: {{ .Values.nydus.mirrorURL | quote }}
            - name: P2P_CLUSTER_ID
              value: {{ .Values.scheduler.clusterID | quote }}
            - name: MTLS_SECRET_NAME
              value: {{ .Values.mtlsSecretName | quote }}
            - name: MANAGER_API_CREDENTIALS_SECRET
              value: {{ .Values.managerApiCredentialsSecret | quote }}
            - name: DRAGONFLY_CHART_REPO
              value: {{ .Values.dragonfly.chart.repo | quote }}
            - name: DRAGONFLY_CHART_NAME
              value: {{ .Values.dragonfly.chart.name | quote }}
            - name: DRAGONFLY_CHART_VERSION
              value: {{ .Values.dragonfly.chart.version | quote }}
            - name: EXTRAS_CHART_REPO
              value: {{ .Values.extras.chart.repo | quote }}
            - name: EXTRAS_CHART_NAME
              value: {{ .Values.extras.chart.name | quote }}
            - name: EXTRAS_CHART_VERSION
              value: {{ .Values.extras.chart.version | quote }}
            - name: CONTAINERD_MIRROR_PORT
              value: {{ .Values.containerdMirror.port | quote }}
            - name: CONTAINERD_MIRROR_CHART_REPO
              value: {{ .Values.containerdMirror.chart.repo | quote }}
            - name: CONTAINERD_MIRROR_CHART_NAME
              value: {{ .Values.containerdMirror.chart.name | quote }}
            - name: CONTAINERD_MIRROR_CHART_VERSION
              value: {{ .Values.containerdMirror.chart.version | quote }}
            - name: HOST_SYNC_CHART_REPO
              value: {{ .Values.hostSync.chart.repo | quote }}
            - name: HOST_SYNC_CHART_NAME
              value: {{ .Values.hostSync.chart.name | quote }}
            - name: HOST_SYNC_CHART_VERSION
              value: {{ .Values.hostSync.chart.version | quote }}
            - name: SCHEDULER_CERT_CHART_REPO
              value: {{ .Values.schedulerCert.chart.repo | quote }}
            - name: SCHEDULER_CERT_CHART_NAME
              value: {{ .Values.schedulerCert.chart.name | quote }}
            - name: SCHEDULER_CERT_CHART_VERSION
              value: {{ .Values.schedulerCert.chart.version | quote }}
            - name: STATIC_CHART_REPO
              value: {{ .Values.static.chart.repo | quote }}
            - name: STATIC_CHART_NAME
              value: {{ .Values.static.chart.name | quote }}
            - name: STATIC_CHART_VERSION
              value: {{ .Values.static.chart.version | quote }}
            - name: STATIC_RELEASE_NAME
              value: {{ .Values.static.releaseName | quote }}
            - name: CLIENT_RELEASE_REPO
              value: {{ .Values.releases.client | quote }}
            - name: NYDUS_RELEASE_REPO
              value: {{ .Values.releases.nydus | quote }}
            - name: NYDUS_SNAPSHOTTER_RELEASE_REPO
              value: {{ .Values.releases.snapshotter | quote }}
            - name: CLIENT_VERSION
              value: {{ .Values.versions.client | quote }}
            - name: NYDUS_VERSION
              value: {{ .Values.versions.nydus | quote }}
            - name: NYDUS_SNAPSHOTTER_VERSION
              value: {{ .Values.versions.snapshotter | quote }}
            - name: CLIENT_SHA256_AMD64
              value: {{ .Values.checksums.client.amd64 | quote }}
            - name: CLIENT_SHA256_ARM64
              value: {{ .Values.checksums.client.arm64 | quote }}
            - name: NYDUS_SHA256_AMD64
              value: {{ .Values.checksums.nydus.amd64 | quote }}
            - name: NYDUS_SHA256_ARM64
              value: {{ .Values.checksums.nydus.arm64 | quote }}
            - name: NYDUS_SNAPSHOTTER_SHA256_AMD64
              value: {{ .Values.checksums.snapshotter.amd64 | quote }}
            - name: NYDUS_SNAPSHOTTER_SHA256_ARM64
              value: {{ .Values.checksums.snapshotter.arm64 | quote }}
            - name: NYDUS_SNAPSHOTTER_BINARY_SHA256_AMD64
              value: {{ .Values.checksums.snapshotterBinary.amd64 | quote }}
            - name: NYDUS_SNAPSHOTTER_BINARY_SHA256_ARM64
              value: {{ .Values.checksums.snapshotterBinary.arm64 | quote }}
            - name: EXTRAS_INGRESS_CONTROLLER
              value: {{ .Values.extras.ingress.controller | quote }}
            - name: EXTRAS_INGRESS_CLASS_NAME
              value: {{ .Values.extras.ingress.className | quote }}
            - name: EXTRAS_INGRESS_GRPC_ENABLED
              value: {{ .Values.extras.ingress.grpcEnabled | quote }}
            - name: EXTRAS_INGRESS_REST_ENABLED
              value: {{ .Values.extras.ingress.restEnabled | quote }}
            - name: EXTRAS_INGRESS_TLS_SECRET
              value: {{ .Values.extras.ingress.tlsSecret | quote }}
            - name: EXTRAS_TRAEFIK_SERVERS_TRANSPORT_ENABLED
              value: {{ .Values.extras.ingress.traefikServersTransportEnabled | quote }}
            {{- if .Values.machineBootstrap.disabled }}
            - name: MACHINE_BOOTSTRAP_DISABLED
              value: "true"
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
