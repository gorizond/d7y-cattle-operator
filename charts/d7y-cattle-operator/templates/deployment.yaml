apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "d7y-cattle-operator.fullname" . }}
  labels:
    {{- include "d7y-cattle-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "d7y-cattle-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "d7y-cattle-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "d7y-cattle-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.Version) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElect }}
          env:
            - name: MANAGER_GRPC_DOMAIN
              value: {{ .Values.manager.grpcDomain | quote }}
            - name: MANAGER_GRPC_PORT
              value: {{ .Values.manager.grpcPort | quote }}
            - name: MANAGER_API_URL
              value: {{ .Values.manager.apiURL | quote }}
            - name: NGINX_STATIC_URL
              value: {{ .Values.nginx.staticURL | quote }}
            - name: MTLS_SECRET_NAME
              value: {{ .Values.mtlsSecretName | quote }}
            - name: MANAGER_API_CREDENTIALS_SECRET
              value: {{ .Values.managerApiCredentialsSecret | quote }}
            - name: DRAGONFLY_CHART_REPO
              value: {{ .Values.dragonfly.chart.repo | quote }}
            - name: DRAGONFLY_CHART_NAME
              value: {{ .Values.dragonfly.chart.name | quote }}
            - name: DRAGONFLY_CHART_VERSION
              value: {{ .Values.dragonfly.chart.version | quote }}
            - name: EXTRAS_CHART_REPO
              value: {{ .Values.extras.chart.repo | quote }}
            - name: EXTRAS_CHART_NAME
              value: {{ .Values.extras.chart.name | quote }}
            - name: EXTRAS_CHART_VERSION
              value: {{ .Values.extras.chart.version | quote }}
            - name: EXTRAS_INGRESS_CONTROLLER
              value: {{ .Values.extras.ingress.controller | quote }}
            - name: EXTRAS_INGRESS_CLASS_NAME
              value: {{ .Values.extras.ingress.className | quote }}
            - name: EXTRAS_INGRESS_GRPC_ENABLED
              value: {{ .Values.extras.ingress.grpcEnabled | quote }}
            - name: EXTRAS_INGRESS_REST_ENABLED
              value: {{ .Values.extras.ingress.restEnabled | quote }}
            - name: EXTRAS_INGRESS_TLS_SECRET
              value: {{ .Values.extras.ingress.tlsSecret | quote }}
            - name: EXTRAS_TRAEFIK_SERVERS_TRANSPORT_ENABLED
              value: {{ .Values.extras.ingress.traefikServersTransportEnabled | quote }}
            - name: NYDUS_ENABLED
              value: {{ .Values.nydus.enabled | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WEBHOOK_PORT
              value: {{ .Values.webhook.port | quote }}
            - name: WEBHOOK_CERT_DIR
              value: {{ .Values.webhook.certDir | quote }}
            - name: WEBHOOK_SERVICE_NAME
              value: {{ include "d7y-cattle-operator.webhookName" . }}
          ports:
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: webhook-certs
              mountPath: {{ .Values.webhook.certDir }}
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-certs
          secret:
            secretName: {{ include "d7y-cattle-operator.webhookName" . }}-cert
            optional: true
      {{- end }}
