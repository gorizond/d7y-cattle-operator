apiVersion: v1
kind: Service
metadata:
  name: {{ include "d7y-cattle-operator.fullname" . }}-webhook
  labels:
    {{- include "d7y-cattle-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "d7y-cattle-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
      protocol: TCP
