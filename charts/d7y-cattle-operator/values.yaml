replicaCount: 1

image:
  repository: ghcr.io/gorizond/d7y-cattle-operator
  # Defaults to v<chart version> to match the release image tags.
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

# Secret holding the CA and leaf certificate shared with Dragonfly.
mtlsSecretName: dragonfly-p2p-mtls

# Secret with manager REST API credentials. The operator creates it in its own
# namespace when absent (keys: username, password, jwt-key) and feeds the
# password and JWT key to the manager. No secret values are rendered as chart
# values.
managerApiCredentialsSecret: ""

manager:
  # Public hostname of the manager gRPC endpoint (no scheme).
  grpcDomain: ""
  # Public gRPC port used by schedulers to reach the manager edge.
  grpcPort: 443
  # Public HTTPS URL of the manager REST API.
  apiURL: ""

nginx:
  # Base URL of the static asset server (http or https).
  staticURL: ""

nydus:
  # Optional HTTPS mirror path for nydus blobs in the bootstrap payload.
  # Empty keeps the dfdaemon proxy fallback. No domain is hardcoded.
  mirrorURL: ""

# Scheduler DNS and internal Service identities. The public LB IP is resolved at
# reconcile time from d7y-scheduler.<cluster-id>.<domain>; the service IP is
# pinned as the non-headless scheduler client Service ClusterIP. The resolved
# public IP(s), the service IP, and manager DNS names are the P2P leaf SANs.
scheduler:
  # Optional fallback when provisioning Cluster status.clusterName is empty.
  # Leave empty to always require status.clusterName.
  clusterID: ""
  # Required. No domain is hardcoded in this chart; set the deployment's
  # base domain (for example via --set scheduler.domain=example.com).
  domain: ""

dragonfly:
  chart:
    # Fork with the manager grpc.tls rendering fix, TLS-aware gRPC probes,
    # and the non-headless scheduler client Service.
    repo: https://gorizond.github.io/dragonflyoss-helm-charts
    name: dragonfly
    # 1.10.1-patch.2 is the verified version. Other versions are allowed but
    # produce an UnsupportedChartVersion warning event.
    version: 1.10.1-patch.2

# dragonfly-extras chart owns the manager Ingresses and optional VPAs.
extras:
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: dragonfly-extras
    version: 0.1.12
  ingress:
    # "auto" picks the controller from the target cluster's CRD capabilities:
    # traefik only when every Traefik kind the enabled features need exists,
    # otherwise nginx (the RKE2 default). "nginx"/"traefik" force a controller.
    controller: auto
    # Empty keeps the cluster default; the extras chart sets "traefik" only
    # when Traefik is the resolved controller.
    className: ""
    grpcEnabled: true
    restEnabled: true
    # Empty disables the Ingress TLS block.
    tlsSecret: ""
    traefikServersTransportEnabled: true

# Per-seed host sync keeps /etc/dragonfly current from the scheduler-ips
# annotation without touching systemd units.
hostSync:
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: p2p-host-sync
    version: 0.1.5

# Per-seed scheduler certificate delivery.
schedulerCert:
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: p2p-scheduler-cert
    version: 0.1.0

# Operator-managed p2p-static release on the manager-labeled cluster.
static:
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: p2p-static
    version: 0.1.13
  releaseName: p2p-static

# GitHub release repositories and version fallbacks. Checksums are fallback
# pins; release sidecars are preferred when available.
releases:
  client: dragonflyoss/client
  nydus: dragonflyoss/nydus
  snapshotter: containerd/nydus-snapshotter

versions:
  client: v1.5.14
  nydus: v2.4.5
  snapshotter: v0.16.0

checksums:
  client:
    amd64: ba080e62f1626ab2fc2a5a0629a5cd912cc15099508820403108abbe2f75b1f7
    arm64: 370ff792a1c6957a7244b770d6cd12792668e326b2282b3017fea2cbfa3510af
  nydus:
    amd64: 1ad7b793a1996577e462b0bf5c1a22e4450b9c04f7e9e99d4b274ccc92f19072
    arm64: 85925af702d79fc3a8b9d501a5267ddc9f81449ff9fe94841845eb98eda84593
  snapshotter:
    amd64: 24e4ceaae9c87e396e71e89bd3eb074f2cc6a5a14b1a2081c8d890481857a0e4
    arm64: 136e9c649a63c16b3d3322a15fcdf918e7dda9a4cbb043e2923451e87a8ba08f
  snapshotterBinary:
    amd64: 9bd24308ef51139310bf58927a97eec49567d0154606bc5774ad69d2ee492ff0
    arm64: 399f7a5b800bb6d05c63bbb340e7fa1820b84609b882589a6a95dd8796d03859

# Strict node-local containerd registry mirror for seed/data clusters.
containerdMirror:
  # Node-local dfdaemon/containerd mirror port used in the hosts.toml files
  # delivered to every managed cluster. Must match the mirror chart.
  port: 4001
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: containerd-mirror
    version: 0.1.1

leaderElect: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
