replicaCount: 1

image:
  repository: ghcr.io/gorizond/d7y-cattle-operator
  # Defaults to v<chart version> to match the release image tags.
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

# Secret holding the CA and leaf certificate shared with Dragonfly.
mtlsSecretName: dragonfly-p2p-mtls

# Secret with manager REST API credentials (keys: username, password).
managerApiCredentialsSecret: ""

manager:
  # Public hostname of the manager gRPC endpoint (no scheme).
  grpcDomain: ""
  # Public HTTPS URL of the manager REST API.
  apiURL: ""

nginx:
  # Base URL of the static asset server (http or https).
  staticURL: ""

dragonfly:
  chart:
    repo: https://dragonflyoss.github.io/helm-charts
    name: dragonfly
    # 1.10.1 is the verified version. Other versions are allowed but produce
    # an UnsupportedChartVersion warning event.
    version: 1.10.1

# dragonfly-extras chart owns the manager Ingresses and optional VPAs.
extras:
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: dragonfly-extras
    version: 0.1.4
  ingress:
    # nginx keeps the mTLS gRPC/REST annotations; traefik terminates gRPC TLS
    # at the edge and renders a REST IngressRoute with a CRD ServersTransport.
    controller: nginx
    className: ""
    grpcEnabled: true
    restEnabled: true
    # Empty disables the Ingress TLS block.
    tlsSecret: ""
    traefikServersTransportEnabled: true

webhook:
  # Admission webhook server and MutatingWebhookConfiguration.
  enabled: true
  # Admission webhook port served by the operator.
  port: 9443
  # Directory where needacert mounts tls.crt/tls.key.
  certDir: /etc/webhook/certs
  failurePolicy: Ignore

leaderElect: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
