replicaCount: 1

image:
  repository: ghcr.io/gorizond/d7y-cattle-operator
  # Defaults to v<chart version> to match the release image tags.
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

# Secret holding the CA and leaf certificate shared with Dragonfly.
mtlsSecretName: dragonfly-p2p-mtls

# Secret with manager REST API credentials. The operator creates it in its own
# namespace when absent (keys: username, password, jwt-key) and feeds the
# password and JWT key to the manager. No secret values are rendered as chart
# values.
managerApiCredentialsSecret: ""

manager:
  # Public hostname of the manager gRPC endpoint (no scheme).
  grpcDomain: ""
  # Public gRPC port used by schedulers to reach the manager edge.
  grpcPort: 443
  # Public HTTPS URL of the manager REST API.
  apiURL: ""

nginx:
  # Base URL of the static asset server (http or https).
  staticURL: ""

nydus:
  # HTTPS mirror path for nydus blobs served by the registry proxy, for example
  # https://proxy.example.test/docker.io. Empty keeps the dfdaemon proxy
  # fallback in the generated nydusd backend. No domain is hardcoded.
  mirrorURL: ""

# Scheduler DNS and internal Service identities. The public LB IP is resolved at
# reconcile time from d7y-scheduler.<cluster-id>.<domain>; the service IP is
# pinned as the non-headless scheduler client Service ClusterIP. The resolved
# public IP(s), the service IP, and manager DNS names are the P2P leaf SANs.
scheduler:
  # Optional fallback when provisioning Cluster status.clusterName is empty.
  # Leave empty to always require status.clusterName.
  clusterID: ""
  # Required. No domain is hardcoded in this chart; set the deployment's
  # base domain (for example via --set scheduler.domain=example.com).
  domain: ""

dragonfly:
  chart:
    # Fork with the manager grpc.tls rendering fix, TLS-aware gRPC probes,
    # and the non-headless scheduler client Service.
    repo: https://gorizond.github.io/dragonflyoss-helm-charts
    name: dragonfly
    # 1.10.1-patch.2 is the verified version. Other versions are allowed but
    # produce an UnsupportedChartVersion warning event.
    version: 1.10.1-patch.2

# dragonfly-extras chart owns the manager Ingresses and optional VPAs.
extras:
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: dragonfly-extras
    version: 0.1.10
  ingress:
    # nginx terminates edge mTLS and uses GRPCS with client certificates to the
    # manager; traefik terminates edge mTLS and uses HTTPS IngressRoutes with
    # CRD ServersTransports for the gRPC and REST backends.
    controller: nginx
    className: ""
    grpcEnabled: true
    restEnabled: true
    # Empty disables the Ingress TLS block.
    tlsSecret: ""
    traefikServersTransportEnabled: true

# Harbor chart (external). Redis is the existing <cluster>-keydb HelmOp.
harbor:
  chart:
    repo: https://helm.goharbor.io
    name: harbor
    version: 1.19.4

# Smart registry proxy chart. Stateless, no PVC.
registryProxy:
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: registry-proxy
    version: 0.1.23

# Opt-in admission webhook chart (p2p.dragonfly.io/admission). Independent of
# Harbor/proxy/seed: it only needs proxy.domain and is never auto-installed.
admission:
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: admission-webhook
    version: 0.1.2
  # Optional credential injection for proxy pulls. With networkOnly=true (the
  # default) no imagePullSecrets/serviceAccountName are injected.
  networkOnly: true
  imagePullSecret: ""
  serviceAccountName: ""

# External/existing Harbor and the public proxy endpoint. proxy.domain is the
# operator-wide public proxy DNS name (no scheme); leave empty to disable the
# proxy HelmOp even if a cluster has the proxy annotation.
proxy:
  domain: ""
  harborURL: ""
  # Secret in the operator/local namespace. It is copied per cluster and must
  # contain HARBOR_ADMIN_PASSWORD before the Harbor/proxy HelmOps are applied.
  harborAdminSecret: harbor-admin
  # "*" allows any explicit registry; proxy auth/network is the boundary.
  registries: "*"
  # Optional public proxy path prefix (for example /proxy); empty serves the
  # domain root, as used by a dedicated proxy domain.
  basePath: ""
  # Reuse the Harbor cert-manager Secret; empty uses the ingress default.
  tlsSecret: ""
  # Optional /etc/hosts entries for the registry proxy pod, e.g. a
  # same-cluster Harbor reached through the Traefik ClusterIP.
  hostAliases: []
  # - ip: 203.0.113.10
  #   hostnames:
  #     - harbor.example.test
  # Optional client Basic auth for proxy /v2 reads. Keep disabled until the
  # node registries.yaml carries the matching auth; /api/convert keeps using
  # the webhook secret.
  basicAuthEnabled: false
  basicAuthUsername: d7y-proxy
  # Optional Secret in the operator namespace with a credentials.yaml key.
  # Empty keeps private-upstream credentials disabled.
  upstreamCredentialsSecret: ""

# Strict node-local containerd registry mirror for seed/data clusters.
containerdMirror:
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: containerd-mirror
    version: 0.1.1

webhook:
  # Admission webhook server and MutatingWebhookConfiguration.
  enabled: true
  # Admission webhook port served by the operator.
  port: 9443
  # Directory where needacert mounts tls.crt/tls.key.
  certDir: /etc/webhook/certs
  failurePolicy: Ignore

leaderElect: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
