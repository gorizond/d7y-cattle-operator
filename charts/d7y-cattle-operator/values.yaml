replicaCount: 1

image:
  repository: ghcr.io/gorizond/d7y-cattle-operator
  # Defaults to v<chart version> to match the release image tags.
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

# Secret holding the CA and leaf certificate shared with Dragonfly.
mtlsSecretName: dragonfly-p2p-mtls

# Secret with manager REST API credentials. The operator creates it in its own
# namespace when absent (keys: username, password, jwt-key) and feeds the
# password and JWT key to the manager. No secret values are rendered as chart
# values.
managerApiCredentialsSecret: ""

manager:
  # Public hostname of the manager gRPC endpoint (no scheme).
  grpcDomain: ""
  # Public gRPC port used by schedulers to reach the manager edge.
  grpcPort: 443
  # Public HTTPS URL of the manager REST API.
  apiURL: ""

nginx:
  # Base URL of the static asset server (http or https).
  staticURL: ""

nydus:
  # Optional HTTPS mirror path for nydus blobs in the bootstrap payload.
  # Empty keeps the dfdaemon proxy fallback. No domain is hardcoded.
  mirrorURL: ""

# Scheduler DNS and internal Service identities. The public LB IP is resolved at
# reconcile time from d7y-scheduler.<cluster-id>.<domain>; the service IP is
# pinned as the non-headless scheduler client Service ClusterIP. The resolved
# public IP(s), the service IP, and manager DNS names are the P2P leaf SANs.
scheduler:
  # Optional fallback when provisioning Cluster status.clusterName is empty.
  # Leave empty to always require status.clusterName.
  clusterID: ""
  # Required. No domain is hardcoded in this chart; set the deployment's
  # base domain (for example via --set scheduler.domain=example.com).
  domain: ""

dragonfly:
  chart:
    # Fork with the manager grpc.tls rendering fix, TLS-aware gRPC probes,
    # and the non-headless scheduler client Service.
    repo: https://gorizond.github.io/dragonflyoss-helm-charts
    name: dragonfly
    # 1.10.1-patch.2 is the verified version. Other versions are allowed but
    # produce an UnsupportedChartVersion warning event.
    version: 1.10.1-patch.2

# dragonfly-extras chart owns the manager Ingresses and optional VPAs.
extras:
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: dragonfly-extras
    version: 0.1.10
  ingress:
    # nginx terminates edge mTLS and uses GRPCS with client certificates to the
    # manager; traefik terminates edge mTLS and uses HTTPS IngressRoutes with
    # CRD ServersTransports for the gRPC and REST backends.
    controller: nginx
    className: ""
    grpcEnabled: true
    restEnabled: true
    # Empty disables the Ingress TLS block.
    tlsSecret: ""
    traefikServersTransportEnabled: true

# Strict node-local containerd registry mirror for seed/data clusters.
containerdMirror:
  chart:
    repo: https://gorizond.github.io/d7y-cattle-operator
    name: containerd-mirror
    version: 0.1.1

webhook:
  # Machine-config webhook server and CREATE-only MutatingWebhookConfiguration.
  enabled: true
  # Webhook port served by the operator.
  port: 9443
  # Directory where needacert mounts tls.crt/tls.key.
  certDir: /etc/webhook/certs
  failurePolicy: Ignore

leaderElect: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
