{{- $controller := .Values.ingress.controller | default "nginx" -}}
{{- $scheduler := .Values.scheduler -}}
{{- $host := "" -}}
{{- if and $scheduler.clusterID $scheduler.domain -}}
{{- $host = printf "d7y-scheduler.%v.%s" $scheduler.clusterID $scheduler.domain -}}
{{- end -}}
{{- if and $scheduler.enabled $scheduler.service (eq $controller "traefik") (.Capabilities.APIVersions.Has "traefik.io/v1alpha1") }}
# Public scheduler front: TCP TLS passthrough on websecure. The scheduler
# terminates mTLS itself, so Traefik must not attach a certificate, a
# TLSOption, or a ServersTransport here. Public IP clients have no SNI; the
# DNS alias built from clusterID and domain resolves to the same public LB IP
# and uses that hostname as SNI, so the router defaults to the catch-all
# matcher.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ .Release.Name }}-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dragonfly-extras.labels" . | nindent 4 }}
    component: scheduler
  {{- if and $host $scheduler.publicIP }}
  annotations:
    # Keeps the per-cluster DNS alias pointed at the public Traefik LB IP when
    # external-dns is configured for Traefik CRDs. The alias may also resolve
    # through a zone wildcard.
    external-dns.alpha.kubernetes.io/hostname: {{ $host | quote }}
    external-dns.alpha.kubernetes.io/target: {{ $scheduler.publicIP | quote }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  entryPoints:
    {{- toYaml (.Values.ingress.traefik.entryPoints | default (list "websecure")) | nindent 4 }}
  routes:
    - match: {{ printf "HostSNI(`%s`)" ($scheduler.hostSNI | default "*") | quote }}
      services:
        - name: {{ $scheduler.service | quote }}
          port: {{ $scheduler.port | default 8002 }}
  tls:
    passthrough: true
{{- end }}
