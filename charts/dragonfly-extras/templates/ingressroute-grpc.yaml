{{- $controller := .Values.ingress.controller | default "nginx" -}}
{{- if and .Values.ingress.enabled .Values.ingress.grpc.enabled (eq $controller "traefik") (.Capabilities.APIVersions.Has "traefik.io/v1alpha1") }}
# gRPC TLS terminates at Traefik (the public LE Secret) because the manager
# serves plaintext h2c on its gRPC port. Client certificates are verified at
# the edge by the TLSOption.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-manager-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dragonfly-extras.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  entryPoints:
    {{- toYaml (.Values.ingress.traefik.entryPoints | default (list "websecure")) | nindent 4 }}
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`)" .Values.ingress.grpc.host | quote }}
      services:
        - name: {{ .Values.ingress.grpc.service | quote }}
          port: {{ .Values.ingress.grpc.port }}
          scheme: h2c
  {{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: {{ .Values.ingress.tls.secretName | quote }}
    options:
      name: {{ .Release.Name }}-manager-grpc
  {{- end }}
{{- end }}
