{{- $controller := .Values.ingress.controller | default "nginx" -}}
{{- $grpcTLSSecret := .Values.ingress.grpc.tlsSecret -}}
{{- $grpcEdgeSecret := $grpcTLSSecret | default .Values.ingress.tls.secretName -}}
{{- $transport := .Values.ingress.grpc.serversTransport -}}
{{- if and .Values.ingress.enabled .Values.ingress.grpc.enabled (eq $controller "traefik") (.Capabilities.APIVersions.Has "traefik.io/v1alpha1") }}
# The manager serves gRPC over TLS with client mTLS. Traefik terminates client
# TLS at the edge with the P2P certificate and reaches the manager over HTTPS
# through the <release>-manager-grpc ServersTransport. REST keeps the public
# certificate.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-manager-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dragonfly-extras.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  entryPoints:
    {{- toYaml (.Values.ingress.traefik.entryPoints | default (list "websecure")) | nindent 4 }}
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`)" .Values.ingress.grpc.host | quote }}
      services:
        - name: {{ .Values.ingress.grpc.service | quote }}
          port: {{ .Values.ingress.grpc.port }}
          scheme: https
          {{- if and $transport.enabled $grpcTLSSecret }}
          serversTransport: {{ printf "%s-manager-grpc" .Release.Name | quote }}
          {{- end }}
  {{- if $grpcEdgeSecret }}
  tls:
    secretName: {{ $grpcEdgeSecret | quote }}
    options:
      name: {{ .Release.Name }}-manager-grpc
  {{- end }}
{{- end }}
