{{- if and .Values.ingress.enabled .Values.ingress.mtlsCASecret .Values.ingress.mtlsCA }}
# The CA is public material; no private key is included.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.mtlsCASecret | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dragonfly-extras.labels" . | nindent 4 }}
type: Opaque
data:
  tls.ca: {{ .Values.ingress.mtlsCA | b64enc | quote }}
{{- end }}
