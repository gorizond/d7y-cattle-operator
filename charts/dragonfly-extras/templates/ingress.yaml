{{- $controller := .Values.ingress.controller | default "nginx" -}}
{{- if and .Values.ingress.enabled .Values.ingress.grpc.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-manager-grpc
  labels:
    {{- include "dragonfly-extras.labels" . | nindent 4 }}
  {{- if eq $controller "nginx" }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: GRPCS
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ .Values.ingress.mtlsSecret | quote }}
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.grpc.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.grpc.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.grpc.service | quote }}
                port:
                  number: {{ .Values.ingress.grpc.port }}
---
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.rest.enabled }}
{{- if eq $controller "nginx" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-manager-api
  labels:
    {{- include "dragonfly-extras.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.rest.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.rest.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.rest.service | quote }}
                port:
                  number: {{ .Values.ingress.rest.port }}
{{- else if eq $controller "traefik" }}
{{- if .Capabilities.APIVersions.Has "traefik.io/v1alpha1" }}
# Traefik v3 ignores the service.serversscheme annotation for REST backends,
# so the HTTPS backend is declared with an IngressRoute. Traefik gRPC is out
# of scope for this fix; the gRPC Ingress above stays nginx-only.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-manager-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dragonfly-extras.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  entryPoints:
    {{- toYaml (.Values.ingress.traefik.entryPoints | default (list "websecure")) | nindent 4 }}
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`)" .Values.ingress.rest.host | quote }}
      services:
        - name: {{ .Values.ingress.rest.service | quote }}
          port: {{ .Values.ingress.rest.port }}
          scheme: https
          {{- if .Values.ingress.traefik.serversTransport.enabled }}
          serversTransport: {{ printf "%s-manager-rest" .Release.Name | quote }}
          {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.rest.enabled (eq $controller "traefik") .Values.ingress.traefik.serversTransport.enabled (.Capabilities.APIVersions.Has "traefik.io/v1alpha1") }}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ .Release.Name }}-manager-rest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dragonfly-extras.labels" . | nindent 4 }}
spec:
  insecureSkipVerify: {{ .Values.ingress.traefik.serversTransport.insecureSkipVerify }}
{{- end }}
