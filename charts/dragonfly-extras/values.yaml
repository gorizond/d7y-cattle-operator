# Manager exposure: public manager gRPC via Traefik TCP TLS passthrough, and
# manager REST over HTTPS (public certificate).
ingress:
  enabled: false
  # traefik uses IngressRouteTCP passthrough for manager gRPC and an HTTPS
  # IngressRoute for REST. nginx keeps its existing GRPCS/mTLS Ingress path.
  controller: nginx
  className: ""
  grpc:
    enabled: true
    host: ""
    service: ""
    port: 65003
    # nginx-only manager identity Secret for the GRPCS backend and client mTLS.
    # Traefik uses TCP passthrough and does not consume this value.
    tlsSecret: dragonfly-p2p-manager
  rest:
    enabled: true
    host: ""
    service: ""
    port: 8080
  tls:
    enabled: false
    secretName: ""
  traefik:
    # Entry points used by the REST IngressRoute and the manager gRPC TCP
    # passthrough route.
    entryPoints: ["websecure"]
    serversTransport:
      enabled: true
      insecureSkipVerify: true
  # nginx-only manager identity Secret in this namespace that holds ca.crt
  # for client certificate verification.
  mtlsSecret: dragonfly-p2p-manager

# VerticalPodAutoscalers in recommendation-only mode. Rendered only when the
# autoscaling.k8s.io/v1 CRD is installed and vpa.enabled is true.
#
# The operator sets explicit target names; the fallbacks below derive names from
# clusterName. Pilot must verify the live workload names:
#   keydb   Deployment    <cluster>-keydb
#   manager Deployment    <cluster>-manager
#   control StatefulSet   <cluster>-control-scheduler
#   data    StatefulSet   <cluster>-data-seed-client
vpa:
  enabled: false
  namespace: dragonfly-system
  clusterName: ""
  targets:
    keydb:
      enabled: true
      kind: Deployment
      name: ""
    manager:
      enabled: false
      kind: Deployment
      name: ""
    control:
      enabled: false
      kind: StatefulSet
      name: ""
    data:
      enabled: false
      kind: StatefulSet
      name: ""
