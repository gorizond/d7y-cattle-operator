# Manager Ingresses (gRPC with client mTLS + REST over HTTPS).
ingress:
  enabled: false
  # Both controllers terminate client mTLS at the edge. The manager now serves
  # gRPC over TLS, so nginx uses a GRPCS backend and Traefik uses an HTTPS
  # backend with a CRD ServersTransport.
  controller: nginx
  className: ""
  grpc:
    enabled: true
    host: ""
    service: ""
    port: 65003
    # P2P Secret served on the gRPC edge and used for the manager backend
    # mTLS. The scheduler verifies the manager with the P2P CA, so this must
    # stay the P2P Secret while REST keeps the public one.
    tlsSecret: ""
    # Traefik ServersTransport for the manager gRPC backend. The manager serves
    # TLS with client mTLS; rootCAs and the client certificate come from the
    # P2P Secret (ca.crt and tls.crt/tls.key). insecureSkipVerify is not set.
    serversTransport:
      enabled: true
      # Defaults to ingress.grpc.host.
      serverName: ""
      # Defaults to ingress.grpc.tlsSecret.
      secretName: ""
  rest:
    enabled: true
    host: ""
    service: ""
    port: 8080
  tls:
    enabled: false
    secretName: ""
  traefik:
    # Entry points used by the REST and gRPC IngressRoutes.
    entryPoints: ["websecure"]
    serversTransport:
      enabled: true
      insecureSkipVerify: true
  # Public scheduler gRPC front. TLS is passed through end-to-end to the
  # scheduler; Traefik never terminates it and no LE certificate is used.
  # The DNS alias (host) must resolve to publicIP; the P2P leaf certificate
  # carries the publicIP SAN, not the hostname.
  scheduler:
    enabled: false
    publicIP: ""
    host: ""
    service: ""
    port: 8002
    # HostSNI matcher for the TCP router. The catch-all '*' also covers
    # clients that dial the public IP and send no SNI. Set an explicit host or
    # IP when the entry point is shared with other TCP passthrough routes.
    hostSNI: "*"
  # Secret in this namespace that holds ca.crt for nginx client certificate
  # verification.
  mtlsSecret: dragonfly-p2p-mtls
  # Internal CA PEM. When non-empty together with mtlsCASecret, the chart
  # renders an Opaque Secret with key tls.ca for the Traefik TLSOption.
  mtlsCA: ""
  # CA-only Secret (key tls.ca) used by the Traefik TLSOption clientAuth.
  mtlsCASecret: dragonfly-p2p-mtls-ca

# VerticalPodAutoscalers in recommendation-only mode. Rendered only when the
# autoscaling.k8s.io/v1 CRD is installed and vpa.enabled is true.
#
# The operator sets explicit target names; the fallbacks below derive names from
# clusterName. Pilot must verify the live workload names:
#   keydb   Deployment    <cluster>-keydb
#   manager Deployment    <cluster>-manager
#   control StatefulSet   <cluster>-control-scheduler
#   data    StatefulSet   <cluster>-data-seed-client
#   nydus   DaemonSet     <cluster>-nydus-snapshotter
vpa:
  enabled: false
  namespace: dragonfly-system
  clusterName: ""
  targets:
    keydb:
      enabled: true
      kind: Deployment
      name: ""
    manager:
      enabled: false
      kind: Deployment
      name: ""
    control:
      enabled: false
      kind: StatefulSet
      name: ""
    data:
      enabled: false
      kind: StatefulSet
      name: ""
    nydus:
      enabled: false
      kind: DaemonSet
      name: ""
