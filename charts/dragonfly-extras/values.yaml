# Manager exposure: public manager gRPC via Traefik TCP TLS passthrough, and
# manager REST over HTTPS (public certificate).
ingress:
  enabled: false
  # traefik uses IngressRouteTCP passthrough for manager gRPC and an HTTPS
  # IngressRoute for REST. nginx keeps its existing GRPCS/mTLS Ingress path.
  controller: nginx
  className: ""
  grpc:
    enabled: true
    host: ""
    service: ""
    port: 65003
    # nginx-only P2P Secret for the GRPCS backend and client mTLS. Traefik
    # uses TCP passthrough and does not consume this value.
    tlsSecret: ""
  rest:
    enabled: true
    host: ""
    service: ""
    port: 8080
  tls:
    enabled: false
    secretName: ""
  traefik:
    # Entry points used by the REST IngressRoute and the manager/scheduler TCP
    # passthrough routes.
    entryPoints: ["websecure"]
    serversTransport:
      enabled: true
      insecureSkipVerify: true
  # nginx-only Secret in this namespace that holds ca.crt for client
  # certificate verification.
  mtlsSecret: dragonfly-p2p-mtls

# Public scheduler front owned by this chart. The backend is the Dragonfly fork
# chart's headless scheduler Service. DaemonSets and bootstrap clients use the
# same public host. TLS is passed through end-to-end; Traefik never terminates
# it and no LE certificate is used.
scheduler:
  enabled: false
  # Fleet cluster ID and base domain build d7y-scheduler.<cluster-id>.<domain>.
  # Both are required when enabled; no domain is hardcoded in this chart.
  clusterID: ""
  domain: ""
  # Public Traefik LB IP used as the external-dns target. The P2P leaf carries
  # the alias hostname as a DNS SAN, not this IP.
  publicIP: ""
  # HostSNI matcher for the TCP router. The catch-all '*' also covers clients
  # that dial the public IP and send no SNI. Set an explicit host or IP when
  # the entry point is shared with other TCP passthrough routes.
  hostSNI: "*"
  # Headless scheduler Service created by the fork chart control release.
  service: ""
  port: 8002

# VerticalPodAutoscalers in recommendation-only mode. Rendered only when the
# autoscaling.k8s.io/v1 CRD is installed and vpa.enabled is true.
#
# The operator sets explicit target names; the fallbacks below derive names from
# clusterName. Pilot must verify the live workload names:
#   keydb   Deployment    <cluster>-keydb
#   manager Deployment    <cluster>-manager
#   control StatefulSet   <cluster>-control-scheduler
#   data    StatefulSet   <cluster>-data-seed-client
vpa:
  enabled: false
  namespace: dragonfly-system
  clusterName: ""
  targets:
    keydb:
      enabled: true
      kind: Deployment
      name: ""
    manager:
      enabled: false
      kind: Deployment
      name: ""
    control:
      enabled: false
      kind: StatefulSet
      name: ""
    data:
      enabled: false
      kind: StatefulSet
      name: ""
