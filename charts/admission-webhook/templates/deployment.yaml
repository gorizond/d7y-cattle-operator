apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "admission-webhook.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "admission-webhook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "admission-webhook.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "admission-webhook.serviceAccountName" . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admission-webhook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /admission-webhook
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PROXY_DOMAIN
              value: {{ .Values.proxy.domain | quote }}
            - name: ADMISSION_REGISTRIES
              value: {{ join "," .Values.registries | quote }}
            - name: ADMISSION_IMAGE_PULL_SECRET
              value: {{ .Values.inject.imagePullSecret | quote }}
            - name: ADMISSION_SERVICE_ACCOUNT
              value: {{ .Values.inject.serviceAccountName | quote }}
            - name: ADMISSION_NETWORK_ONLY
              value: {{ .Values.networkOnly | quote }}
            - name: ADMISSION_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: ADMISSION_CERT_DIR
              value: {{ .Values.certDir | quote }}
            - name: ADMISSION_SERVICE_NAME
              value: {{ .Release.Name | quote }}
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: {{ .Values.certDir }}
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ include "admission-webhook.tlsSecretName" . }}
