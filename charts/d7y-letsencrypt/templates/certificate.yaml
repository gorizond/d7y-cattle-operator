apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: manager-edge-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.secretName }}
  dnsNames:
{{ toYaml .Values.dnsNames | indent 4 }}
  issuerRef:
    name: {{ .Values.issuerName }}
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: {{ .Values.privateKeyAlgorithm }}
    size: {{ .Values.privateKeySize }}
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
