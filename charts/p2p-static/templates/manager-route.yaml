{{- if .Values.manager.enabled }}
{{- $host := required "manager.host is required when manager.enabled=true" .Values.manager.host }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ printf "%s-manager" (include "p2p-static.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "p2p-static.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "traefik" | quote }}
  entryPoints:
    - {{ .Values.manager.entryPoint | quote }}
  routes:
    - match: {{ printf "Host(`%s`) && (PathPrefix(`/p2p-install.sh`) || PathPrefix(`/bin`) || PathPrefix(`/nydus`) || PathPrefix(`/client`) || PathPrefix(`/snapshotter`))" $host | quote }}
      kind: Rule
      priority: 1000
      services:
        - name: {{ include "p2p-static.fullname" . | quote }}
          port: {{ .Values.service.port }}
  {{- with .Values.manager.tlsSecret }}
  tls:
    secretName: {{ . | quote }}
  {{- end }}
{{- end }}
