apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "p2p-static.fullname" . }}
  labels:
    {{- include "p2p-static.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "p2p-static.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "p2p-static.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.static.populate.enabled }}
      initContainers:
        - name: populate-static
          image: "{{ .Values.static.populate.image.repository }}:{{ .Values.static.populate.image.tag }}"
          imagePullPolicy: {{ .Values.static.populate.image.pullPolicy }}
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "/scripts/populate-static.sh"]
          env:
            - name: STATIC_DIR
              value: /usr/share/nginx/static
            - name: SELECTOR_SRC
              value: /scripts/nydus-fs-select.sh
            - name: DOWNLOAD_RETRIES
              value: {{ .Values.static.populate.retries | quote }}
            - name: SELECTOR_ENABLED
              value: {{ ternary "1" "0" .Values.static.populate.selector.enabled | quote }}
            - name: NYDUS_VERSION
              value: {{ .Values.static.populate.nydus.version | quote }}
            - name: NYDUS_BINARIES
              value: {{ join " " .Values.static.populate.nydus.binaries | quote }}
            - name: NYDUS_TARBALL_URL
              value: {{ .Values.static.populate.nydus.tarballURL | quote }}
            - name: NYDUS_TARBALL_SHA256
              value: {{ .Values.static.populate.nydus.tarballSHA256 | quote }}
            - name: NYDUS_TARBALL_ROOT
              value: {{ .Values.static.populate.nydus.tarballRoot | quote }}
            - name: DFDAEMON_ENABLED
              value: {{ ternary "1" "0" .Values.static.populate.dfdaemon.enabled | quote }}
            - name: DFDAEMON_VERSION
              value: {{ .Values.static.populate.dfdaemon.version | quote }}
            - name: DFDAEMON_TARBALL_URL
              value: {{ .Values.static.populate.dfdaemon.tarballURL | quote }}
            - name: DFDAEMON_TARBALL_SHA256
              value: {{ .Values.static.populate.dfdaemon.tarballSHA256 | quote }}
            - name: DFDAEMON_TARBALL_ROOT
              value: {{ .Values.static.populate.dfdaemon.tarballRoot | quote }}
            - name: DFDAEMON_BINARY
              value: {{ .Values.static.populate.dfdaemon.binary | quote }}
            - name: DFGET_BINARY
              value: {{ .Values.static.populate.dfdaemon.dfget | quote }}
          volumeMounts:
            - name: static
              mountPath: /usr/share/nginx/static
            - name: config
              mountPath: /scripts
              readOnly: true
      {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: static
              mountPath: /usr/share/nginx/static
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "p2p-static.fullname" . }}-config
        - name: static
          {{- if .Values.static.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.static.existingClaim | quote }}
          {{- else if .Values.static.sizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.static.sizeLimit | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
