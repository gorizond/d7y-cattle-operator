apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "p2p-static.fullname" . }}-config
  labels:
    {{- include "p2p-static.labels" . | nindent 4 }}
data:
  default.conf: |-
    large_client_header_buffers 4 32k;
    client_header_buffer_size 32k;

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        server_tokens off;
        root /usr/share/nginx/static;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /bin/ {
            try_files $uri =404;
            autoindex off;
        }

        location /nydus/ {
            try_files $uri =404;
            autoindex off;
        }

        location / {
            return 404;
        }
    }
