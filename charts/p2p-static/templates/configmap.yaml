apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "p2p-static.fullname" . }}-config
  labels:
    {{- include "p2p-static.labels" . | nindent 4 }}
data:
  default.conf: |-
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        server_tokens off;
        root /usr/share/nginx/static;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /p2p-install.sh {
            access_log off;
            alias /etc/nginx/conf.d/p2p-install.sh;
            default_type text/x-shellscript;
            add_header Cache-Control "no-store" always;
        }

        location /bin/ {
            try_files $uri =404;
            autoindex off;
        }

        location /nydus/ {
            try_files $uri =404;
            autoindex off;
        }

        location /client/ {
            try_files $uri =404;
            autoindex off;
        }

        location /snapshotter/ {
            try_files $uri =404;
            autoindex off;
        }

        location / {
            return 404;
        }
    }
  populate-static.sh: |-
{{ .Files.Get "files/populate-static.sh" | indent 4 }}
  nydus-fs-select.sh: |-
{{ .Files.Get "files/nydus-fs-select.sh" | indent 4 }}
  p2p-install.sh: |-
{{ .Files.Get "files/p2p-install.sh" | indent 4 }}
  populate-plan.txt: |-
{{ include "p2p-static.populatePlan" . | indent 4 }}
