replicaCount: 1

image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

# Serve the static /bin and /nydus assets on the manager host.
# The manager REST API keeps its own /api paths; these prefixes do not overlap.
manager:
  enabled: false
  host: ""
  entryPoint: websecure
  # TLS Secret for the manager host (for example the manager public cert secret).
  tlsSecret: ""

ingress:
  # When enabled, each hosts[].host must be set and must match the published
  # static URL.
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

static:
  existingClaim: ""
  sizeLimit: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
