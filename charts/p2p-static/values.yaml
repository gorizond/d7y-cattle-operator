replicaCount: 1

image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

# Serve the static /bin and /nydus assets on the manager host.
# The manager REST API keeps its own /api paths; these prefixes do not overlap.
manager:
  enabled: false
  host: ""
  entryPoint: websecure
  # TLS Secret for the manager host (for example the manager public cert secret).
  tlsSecret: ""

ingress:
  # When enabled, each hosts[].host must be set and must match the published
  # static URL.
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

static:
  existingClaim: ""
  sizeLimit: ""
  # Self-populate the static volume from pinned release artifacts. The init
  # container writes versioned/arch layouts under /client, /nydus, and
  # /snapshotter, plus the legacy /bin and /nydus/<version> compatibility paths
  # for the node architecture. No PVC: emptyDir data lives for the pod lifetime
  # and is re-downloaded on every pod recreation.
  populate:
    # The integrated operator sets this true and supplies all version/repo/
    # checksum values. The standalone chart default is false so `helm lint`
    # and render checks do not require a second copy of those defaults.
    enabled: false
    image:
      repository: curlimages/curl
      tag: "8.10.1"
      pullPolicy: IfNotPresent
    retries: 5
    client:
      enabled: true
      # Required from the operator: /bin compatibility version and the full
      # client version/arch plan (URL, fallback checksum, tarball root).
      compatVersion: ""
      versions: []
    nydus:
      enabled: true
      # Required from the operator.
      version: ""
      tarballRoot: nydus-static
      binaries:
        - nydusd
        - nydus-image
        - nydus-overlayfs
      arches: []
    snapshotter:
      enabled: true
      # Required from the operator.
      version: ""
      arches: []
    selector:
      enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
