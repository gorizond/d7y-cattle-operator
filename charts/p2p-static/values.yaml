replicaCount: 1

image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

# Serve the static /bin and /nydus assets on the manager host.
# The manager REST API keeps its own /api paths; these prefixes do not overlap.
manager:
  enabled: false
  host: ""
  entryPoint: websecure
  # TLS Secret for the manager host (for example the manager public cert secret).
  tlsSecret: ""

ingress:
  # When enabled, each hosts[].host must be set and must match the published
  # static URL.
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

static:
  existingClaim: ""
  sizeLimit: ""
  # Self-populate the static volume from pinned release artifacts. The init
  # container writes versioned/arch layouts under /client, /nydus, and
  # /snapshotter, plus the legacy /bin and /nydus/<version> compatibility paths
  # for the node architecture. No PVC: emptyDir data lives for the pod lifetime
  # and is re-downloaded on every pod recreation.
  populate:
    enabled: true
    image:
      repository: curlimages/curl
      tag: "8.10.1"
      pullPolicy: IfNotPresent
    retries: 5
    client:
      enabled: true
      # /bin compatibility layout uses this version and the node architecture.
      compatVersion: v1.5.14
      versions:
        - version: v1.5.14
          arches:
            - arch: amd64
              url: https://github.com/dragonflyoss/client/releases/download/v1.5.14/dragonfly-client-v1.5.14-x86_64-unknown-linux-gnu.tar.gz
              sha256: ba080e62f1626ab2fc2a5a0629a5cd912cc15099508820403108abbe2f75b1f7
              tarballRoot: dragonfly-client-v1.5.14-x86_64-unknown-linux-gnu
            - arch: arm64
              url: https://github.com/dragonflyoss/client/releases/download/v1.5.14/dragonfly-client-v1.5.14-aarch64-unknown-linux-gnu.tar.gz
              sha256: 370ff792a1c6957a7244b770d6cd12792668e326b2282b3017fea2cbfa3510af
              tarballRoot: dragonfly-client-v1.5.14-aarch64-unknown-linux-gnu
    nydus:
      enabled: true
      version: v2.4.5
      tarballRoot: nydus-static
      binaries:
        - nydusd
        - nydus-image
        - nydus-overlayfs
      arches:
        - arch: amd64
          tarballURL: https://github.com/dragonflyoss/nydus/releases/download/v2.4.5/nydus-static-v2.4.5-linux-amd64.tgz
          tarballSHA256: 1ad7b793a1996577e462b0bf5c1a22e4450b9c04f7e9e99d4b274ccc92f19072
        - arch: arm64
          tarballURL: https://github.com/dragonflyoss/nydus/releases/download/v2.4.5/nydus-static-v2.4.5-linux-arm64.tgz
          tarballSHA256: 85925af702d79fc3a8b9d501a5267ddc9f81449ff9fe94841845eb98eda84593
    snapshotter:
      enabled: true
      version: v0.16.0-p2p.2
      # The patched fork publishes amd64 only. Do not add an arm64 entry with
      # the amd64 asset: the installer fails clearly instead of mixing builds.
      arches:
        - arch: amd64
          asset: nydus-snapshotter-linux-amd64
          url: https://github.com/gorizond/nydus-snapshotter/releases/download/v0.16.0-p2p.2/nydus-snapshotter-linux-amd64
          sha256: 8f4f68f306ba391cd294cdcb273267732cb82f4ae466564013204198dd003b0b
    selector:
      enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
